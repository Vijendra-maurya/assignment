<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Vijendra Maurya - BCA AI">
<title>Centered Login - Flexbox</title>
<link href="https://fonts.googleapis.com/css2?family=Inter&family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter;background:#f8f9ff}

  /* PARENT - Perfect Center */
  .center-wrapper{
    height: 100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
  }

  /* CARD - Inner Flex */
  .login-box{
    background:#fff;
    width:100%;
    max-width:360px;
    padding:32px;
    border-radius:16px;
    border:1px solid #e5e7eb;
    box-shadow:0 8px 30px rgba(0,0,0,0.06);
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .login-box h2{font-family:Poppins;color:#1a237e;text-align:center}
  .login-box p.sub{text-align:center;color:#6b7280;font-size:13px;margin-top:-10px}

  form{display:flex;flex-direction:column;gap:12px}
  input{padding:11px 14px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;width:100%;outline:none}
  input:focus{border-color:#3949ab}
  .row{display:flex;justify-content:space-between;font-size:12px;align-items:center}
  .btn{padding:11px;border-radius:8px;border:none;font-weight:600;cursor:pointer;background:#1a237e;color:white}
  .btn:hover{background:#111654}
</style>
</head>
<body>

<div class="center-wrapper">
  <div class="login-box">
    <h2>Login - VM</h2>
    <p class="sub">BCA AI | Bareilly | vijendra.xyz@example.com</p>

    <form onsubmit="return false">
      <input type="email" placeholder="Email - vijendra@example.com" required>
      <input type="password" placeholder="Password" required>
      
      <div class="row">
        <label style="display:flex;gap:5px;align-items:center"><input type="checkbox" style="width:auto"> Remember</label>
        <a href="#" style="color:#3949ab;text-decoration:none;font-weight:600">Forgot?</a>
      </div>

      <button class="btn">Login</button>
    </form>

    <p style="text-align:center;font-size:12px;color:#6b7280">Module 7 - display:flex centering</p>
  </div>
</div>

</body>
</html>
